object_types:
  - name: dataset_adapter
    file_pattern:
      - 'src/CIWQS/*.php'
      - 'src/OCPW/*.php'
      - 'src/SMARTS/*.php'
    count: 4
    analyzable: true
    confidence: '[Inferred]'
    note: >
      Domain-specific adapter classes (CIWQS\ESMR, OCPW\ParameterDataset,
      SMARTS\ParameterDataset, SMARTS\StormwaterViolations). Each extends a
      support base class and adds domain-specific query logic for one
      regulatory data source.
    metadata_fields:
      - data_source
      - query_methods
      - filter_options
    complexity_thresholds:
      simple:
        max_lines: 60
      moderate:
        max_lines: 105
      complex:
        min_lines: 105

  - name: support_base
    file_pattern:
      - 'src/Support/Dataset/*.php'
    count: 5
    analyzable: true
    confidence: '[Inferred]'
    note: >
      Infrastructure base classes and trait (FileDataset, CsvDataset,
      HtmlDataset, SocrataDataset, OptionsTrait). Implement shared
      pagination, caching, option-scoping, and file-parsing behaviour.
    metadata_fields:
      - base_class
      - trait_composition
      - public_methods
    complexity_thresholds:
      simple:
        max_lines: 50
      moderate:
        max_lines: 90
      complex:
        min_lines: 90

