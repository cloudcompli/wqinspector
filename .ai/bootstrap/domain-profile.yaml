  strategy_confidence: '[Inferred]'
  note: >
    No file-name prefix clustering (100% unclustered). Module boundaries
    encoded in PSR-4 directory namespaces: CIWQS, OCPW, SMARTS,
    Support/Dataset.
  prefix_families: []
  namespace_modules:
    - namespace: 'CloudCompli\\WQInvestigator\\CIWQS'
      directory: src/CIWQS
      file_count: 1
      domain: CIWQS eSMR regulatory monitoring
      confidence: '[Inferred]'
    - namespace: 'CloudCompli\\WQInvestigator\\OCPW'
      directory: src/OCPW
      file_count: 1
      domain: OC Watersheds CSV data
      confidence: '[Inferred]'
    - namespace: 'CloudCompli\\WQInvestigator\\SMARTS'
      directory: src/SMARTS
      file_count: 2
      domain: SMARTS stormwater data (HTML + Socrata)
      confidence: '[Inferred]'
    - namespace: 'CloudCompli\\WQInvestigator\\Support\\Dataset'
      directory: src/Support/Dataset
      file_count: 5
      domain: Shared dataset infrastructure
      confidence: '[Inferred]'

call_mechanisms:
  - pattern: closure_callback
    type: direct
    confidence: '[Confirmed]'
    occurrence_count: 6
    files_found: 5
    description: >
      PHP closures passed as $callback arguments for option-scoped execution,
      chunked pagination callbacks, and domain result accumulation.
    source: observed

  - pattern: inheritance_delegation
    type: direct
    confidence: '[Confirmed]'
    occurrence_count: 8
    files_found: 4
    description: >
      Domain adapters extend support base classes; call parent::__construct()
      and parent::get() to delegate then refine behaviour.
    source: observed

  - pattern: trait_mixin
    type: direct
    confidence: '[Confirmed]'
    occurrence_count: 2
    files_found: 2
    description: >
      OptionsTrait mixed into FileDataset and SocrataDataset.
    source: observed

  - pattern: external_api_call
    type: direct
    confidence: '[Confirmed]'
    occurrence_count: 3
    files_found: 1
    description: >
      Socrata SODA SDK calls via $this->_socrata->get($url, $queryParameters).
      Resource IDs are hardcoded per adapter (/resource/[RESOURCE_ID].json).
    source: observed

  - pattern: optional_cache_layer
    type: indirect
    confidence: '[Confirmed]'
    occurrence_count: 4
    files_found: 1
    description: >
      phpFastCache integration in SocrataDataset. Cache key = MD5 of
      URL + serialized query params. Cache use toggleable via
      withoutCache($callback).
    source: observed

  - pattern: soql_string_interpolation
    type: dynamic
    confidence: '[Confirmed]'
    occurrence_count: 6
    files_found: 2
    description: >
      SOQL WHERE clauses built by string interpolation in compileWhere()
      (ESMR, StormwaterViolations). Option values injected without
      parameterisation. Flag: potential injection risk if options are
      caller-supplied without sanitisation.
    source: observed

cross_references:
  external_dependencies:
    - name: socrata/soda-php
      role: Socrata SODA API client
      confidence: '[Confirmed]'
    - name: phpfastcache/phpfastcache
      role: File-backed cache for API responses
      confidence: '[Confirmed]'
  linked_servers: []
  synonyms: []

chunking:
  thresholds:
    standard_max: 59
    extended_max: 105
    mega_min: 200
  language_multiplier: 1.0
  confidence: '[Uncertain]'
  note: >
    Thresholds from actual file distribution (median=59, P90=105).
    No mega files. [Uncertain] — fewer than 20 file sample.
  boundary_signals:
    - 'function '
    - 'class '
    - 'interface '
    - 'trait '
    - 'namespace '
    - 'if ('
    - 'foreach ('
    - 'switch ('
    - 'try {'
    - '/**'

