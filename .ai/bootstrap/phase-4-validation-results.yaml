uncertain_items:
  - item: soql_string_interpolation injection risk
    description: >
      ESMR.compileWhere() and StormwaterViolations.compileWhere() build SOQL
      WHERE clauses by direct string interpolation of option values (region_code,
      after, before, within_circle, violation_type). If these options are
      populated from user input without sanitisation, Socrata SOQL injection
      is possible. Risk level depends on caller context — library itself
      provides no escaping.
    confidence: '[Uncertain]'
    sme_question: >
      Are the 'within_circle', 'region_code', 'after', 'before', and
      'violation_type' option values ever populated from untrusted user input
      (e.g., HTTP request parameters)?

  - item: SMARTS\ParameterDataset vs OCPW\ParameterDataset naming collision
    description: >
      Two classes share the name ParameterDataset in different namespaces
      (SMARTS and OCPW). They have identical public APIs (getParameters,
      getParameterResultsByStation/getParameterResultsBySite) but differ
      in backing store (HTML vs CSV) and result-key names (site_facility_name
      vs station). Analysis tools must resolve by fully-qualified namespace.
    confidence: '[Inferred]'
    sme_question: >
      Is the ParameterDataset naming intentional (duck-typed interchangeability)?
      Are they ever used polymorphically, or always constructed explicitly by
      fully-qualified class name?

  - item: getForEachChunk pagination termination
    description: >
      SocrataDataset.getForEachChunk terminates when the Socrata response is
      falsy (empty array). If the API returns an error object instead of an
      empty array on the final page, the loop may hang or raise. The
      termination contract depends on the soda-php SDK behaviour.
    confidence: '[Uncertain]'
    sme_question: >
      Has the chunked pagination been tested against datasets whose total
      record count is exactly divisible by 1000? This edge case would cause
      one extra API call returning an empty array — confirm this is handled.

