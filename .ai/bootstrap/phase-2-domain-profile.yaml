      domain: Shared dataset infrastructure
      confidence: '[Inferred]'

# --- Call Mechanisms ---
# Sampled all 9 source files (small enough to read fully).
call_mechanisms:
  - pattern: closure_callback
    type: direct
    confidence: '[Confirmed]'
    occurrence_count: 6
    files_found: 5
    description: >
      PHP closures passed as $callback arguments — used pervasively for
      option-scoped execution (withOptions), chunked pagination callbacks
      (getForEachChunk), and domain result accumulation. Pattern: function($obj)
      { ... } passed to withOptions() or getForEachChunk().
    source: observed

  - pattern: inheritance_delegation
    type: direct
    confidence: '[Confirmed]'
    occurrence_count: 8
    files_found: 4
    description: >
      Domain adapters extend support base classes (ESMR extends SocrataDataset,
      OCPW\ParameterDataset extends CsvDataset, SMARTS\ParameterDataset extends
      HtmlDataset) and call parent::__construct() / parent::get(). Overridden
      methods refine behaviour before delegating upstream.
    source: observed

  - pattern: trait_mixin
    type: direct
    confidence: '[Confirmed]'
    occurrence_count: 2
    files_found: 2
    description: >
      OptionsTrait mixed into FileDataset and SocrataDataset via PHP 'use'
      keyword. Provides setOption / setOptions / withOptions to both
      file-backed and API-backed dataset hierarchies.
    source: observed

  - pattern: external_api_call
    type: direct
    confidence: '[Confirmed]'
    occurrence_count: 3
    files_found: 1
    description: >
      Socrata SODA SDK calls: $this->_socrata->get($url, $queryParameters).
      API endpoint URLs and resource IDs are hardcoded per adapter
      (e.g., /resource/[RESOURCE_ID].json pattern). Socrata token injected
      via constructor.
    source: observed

  - pattern: optional_cache_layer
    type: indirect
    confidence: '[Confirmed]'
    occurrence_count: 4
    files_found: 1
    description: >
      phpFastCache integration in SocrataDataset: cache lookup before Socrata
      call, cache set on miss. Cache key is MD5 of URL + serialized query
      params. Cache use can be toggled per-call via withoutCache($callback).
    source: observed

  - pattern: soql_string_interpolation
    type: dynamic
    confidence: '[Confirmed]'
    occurrence_count: 6
    files_found: 2
    description: >
      SOQL WHERE clauses built by string interpolation inside compileWhere()
      methods (ESMR and StormwaterViolations). Option values injected directly
      into SQL-like strings without parameterisation — potential injection risk
      if caller-supplied values are untrusted.
    source: observed

