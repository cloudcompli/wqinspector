    boundaries are encoded in PSR-4 directory namespaces: CIWQS, OCPW,
    SMARTS, Support/Dataset. Class names within each namespace are
    semantically descriptive (ESMR, ParameterDataset, StormwaterViolations).
  prefix_families: []
  namespace_modules:
