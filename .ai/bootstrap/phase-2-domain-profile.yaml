# --- Chunking ---
chunking:
  thresholds:
    standard_max: 59
    extended_max: 105
    mega_min: 200
  language_multiplier: 1.0
  note: >
    Thresholds derived from actual file size distribution (median=59,
    P90=105). No mega files exist in this codebase. [Uncertain] due to
    <20 file sample size.
  confidence: '[Uncertain]'
  boundary_signals:
    - 'function '
    - 'class '
    - 'interface '
    - 'trait '
    - 'namespace '
    - 'if ('
    - 'foreach ('
    - 'switch ('
    - 'try {'
    - '/**'

# --- Database Registry ---
# No local database. Data access is via external APIs (Socrata) and
# local file parsing (CSV, HTML). No SQL DDL, migrations, or ORM models.
databases: []
db_access_note: >
  No database access detected. All data retrieval is via (a) the Socrata
  SODA HTTP API for CIWQS eSMR and SMARTS Stormwater Violations datasets,
  and (b) local file parsing for OC Watersheds CSV exports and SMARTS
  HTML table exports. [Confirmed]

# --- Tenancy Model ---
tenancy_model:
  type: single-tenant
  confidence: '[Confirmed]'
  note: >
    No tenant discriminator columns, RLS policies, per-tenant schemas, or
    connection-routing patterns detected. Library is instantiated per-caller
    with a single Socrata token; no multi-tenant isolation mechanisms exist.

